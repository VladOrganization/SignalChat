name: Build & Publish Docker Images

on:
  push:
    branches:
      - master
      - stage

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name == 'master' && 'latest' || 'stage' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/vladorganization/signal_chat_api:${{ env.TAG }}

  frontend:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name == 'master' && 'latest' || 'stage' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/vladorganization/signal_chat_frontend:${{ env.TAG }}
