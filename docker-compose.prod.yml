# Runs behind an already running Traefik (external network ${TRAEFIK_NETWORK}) that terminates TLS.
# Images are built by GitHub Actions (.github/workflows/docker-publish.yml) and pulled from ghcr.io.
# Settings come from .env (see .env.example).
# Traefik's "postgres" TCP entrypoint (:5432) must already be defined in Traefik's own static config.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ChatDb}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-SA} -d ${POSTGRES_DB:-ChatDb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.tcp.routers.vladoschat-db.rule: HostSNI(`*`)
      traefik.tcp.routers.vladoschat-db.entrypoints: postgres
      traefik.tcp.services.vladoschat-db.loadbalancer.server.port: "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/vladorganization/signal_chat_api:${TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ChatDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ChatDb};Username=${POSTGRES_USER:?set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      Jwt__Issuer: SignalChat
      Jwt__Audience: SignalChat
      OpenIddict__Issuer: https://chat-api.vlados.tech
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      Front-Url__Url: https://chat.vlados.tech
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-images:/app/wwwroot/images
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.vladoschat-api.rule: Host(`chat-api.vlados.tech`)
      traefik.http.routers.vladoschat-api.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.vladoschat-api.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-le}
      traefik.http.services.vladoschat-api.loadbalancer.server.port: "8080"
      com.centurylinklabs.watchtower.enable: "true"

  frontend:
    image: ghcr.io/vladorganization/signal_chat_frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      BACKEND_BASE_URL: "http://backend:8080"
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.vladoschat-front.rule: Host(`chat.vlados.tech`)
      traefik.http.routers.vladoschat-front.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.vladoschat-front.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-le}
      traefik.http.services.vladoschat-front.loadbalancer.server.port: "80"
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    environment:
      # the bundled docker client defaults to an API version too old for this host's daemon
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # --label-enable: only touches containers labeled com.centurylinklabs.watchtower.enable=true
    # (this host runs other, unrelated projects — never auto-update containers we don't own)
    command: --interval 120 --label-enable --cleanup

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

volumes:
  postgres-data:
  backend-images:
