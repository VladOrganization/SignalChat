services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ChatDb
      POSTGRES_USER: SA
      POSTGRES_PASSWORD: Qwerty12
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U SA -d ChatDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ChatDb: "Host=postgres;Port=5432;Database=ChatDb;Username=SA;Password=Qwerty12"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      Jwt__SecretKey: "Dev_Only_Signing_Key_Do_Not_Use_In_Prod_2026"
      Jwt__Issuer: "SignalChat"
      Jwt__Audience: "SignalChat"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-images:/app/wwwroot/images

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8080"
    environment:
      BACKEND_BASE_URL: "http://backend:8080"
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-images:
  postgres-data:
